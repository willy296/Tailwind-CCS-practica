<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind y JavaScript</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 p-6">
    <div id="tarjeta" class="mx-auto max-w-md rounded-xl bg-blue-200 p-8 text-center shadow-lg">
        <h2 class="text-2xl font-bold">Mi tarjeta</h2>
        <p>Selecciona un color</p>
    </div>
    <div class="mt-6 flex justify-center gap-3">
        <button onclick="cambiarColor('azul')" class="rounded bg-blue-600 px-5 py-2 text-white">Azul</button>
        <button onclick="cambiarColor('verde')" class="rounded bg-green-600 px-5 py-2 text-white">Verde</button>
        <button onclick="cambiarColor('rojo')" class="rounded bg-red-600 px-5 py-2 text-white">Rojo</button>
        <button onclick="cambiarColor('amarillo')" class="rounded bg-yellow-600 px-5 py-2 text-white">Amarillo</button>
        <button onclick="cambiarColor('morado')" class="rounded bg-purple-600 px-5 py-2 text-white">Morado</button>
    </div>
    </div>
    </div>
    <script>
        const colores = {
            azul: "bg-blue-200",
            verde: "bg-green-200",
            rojo: "bg-red-200",
            amarillo: "bg-yellow-200",
            morado: "bg-purple-200"
        };
        function cambiarColor(color) {
            const tarjeta = document.getElementById("tarjeta");
            tarjeta.classList.remove(...Object.values(colores));
            tarjeta.classList.add(colores[color]);
        }
    </script>

    <br><br>

    <div class="mx-auto max-w-sm rounded-xl bg-white p-8 text-center shadow">
        <h2 class="text-xl font-bold">Contador de clics</h2>
        <p id="numero" class="my-6 text-6xl font-bold">0</p>
        <div class="flex justify-center gap-2">
            <button onclick="modificar(-1)" class="rounded bg-red-500 px-4 py-2 text-white">-1</button>
            <button onclick="modificar(1)" class="rounded bg-green-500 px-4 py-2 text-white">+1</button>
            <button onclick="reiniciar()" class="rounded bg-gray-700 px-4 py-2 text-white">Reiniciar</button>
        </div>
    </div>
    <script>
        let contador = 0;
        function modificar(cantidad) {
            contador += cantidad;
            limitar();
            actualizar();
        }
        function reiniciar() {
            contador = 0;
            limitar();
            actualizar();
        }
        function actualizar() {
            const numero = document.getElementById("numero");
            numero.textContent = contador;
            numero.classList.toggle("text-green-600", contador > 0);
            numero.classList.toggle("text-red-600", contador < 0);
        }
        function limitar() {
            const numero = document.getElementById("numero");
            numero.textContent = contador;
            if (contador > 20) contador = 20; {
                dispatchEvent(new CustomEvent("limiteAlcanzado", { detail: { limite: 20 } }));
            }
            if (contador < 0) contador = 0;
        }
    </script>

    <br><br>

    <form id="formulario" class="mx-auto max-w-md space-y-4 rounded-xl bg-white p-6 shadow">
        <h2 class="text-2xl font-bold">Registro de estudiante</h2>
        <input id="nombre" type="text" placeholder="Nombre completo" class="w-full rounded border p-3">
        <input id="contrasena" type="text" placeholder="Contraseña" class="w-full rounded border p-3">
        <input id="contraseñaconfirmacion" type="text" placeholder="Confirmar contraseña"
            class="w-full rounded border p-3">
        <input id="correo" type="email" placeholder="Correo electrónico" class="w-full rounded border p-3">
        <button type="submit" class="w-full rounded bg-blue-600 p-3 text-white">Registrarse</button>
        <p id="mensaje" role="status" class="text-sm"></p>
    </form>
    <script>
        document.getElementById("formulario").addEventListener("submit", function (evento) {
            evento.preventDefault();
            const nombre = document.getElementById("nombre").value.trim();
            const contrasena = document.getElementById("contrasena").value.trim();
            const contraseñaconfirmacion = document.getElementById("contraseñaconfirmacion").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const mensaje = document.getElementById("mensaje");
            if (!nombre || !contrasena || !contraseñaconfirmacion || !correo) {
                mensaje.textContent = "Completa todos los campos.";
                mensaje.className = "text-sm text-red-600";
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
                mensaje.textContent = "Correo no válido.";
                mensaje.className = "text-sm text-red-600";
                return;
            }
            if (contrasena !== contraseñaconfirmacion) {
                mensaje.textContent = "Las contraseñas no coinciden.";
                mensaje.className = "text-sm text-red-600";
                return;
            }
            if (contrasena.length < 8) {
                mensaje.textContent = "La contraseña debe tener al menos 8 caracteres.";
                mensaje.className = "text-sm text-red-600";
                return;
            }
            mensaje.textContent = "Bienvenido, " + nombre;
            mensaje.className = "text-sm text-green-600";
        });
    </script>

    <br><br>

    <div class="mx-auto max-w-3xl p-4">
        <h2 class="mb-4 text-2xl font-bold">Catálogo</h2>

        <!-- Controles de búsqueda, categoría y ordenamiento -->
        <div class="mb-5 flex flex-col gap-3 sm:flex-row">
            <input id="buscar" placeholder="Buscar producto..." class="min-w-0 flex-1 rounded border bg-white p-3">

            <select id="filtroCategoria" class="rounded border bg-white p-3">
                <option value="">Todas las categorías</option>
                <option value="Computación">Computación</option>
                <option value="Accesorios">Accesorios</option>
            </select>

            <select id="ordenPrecio" class="rounded border bg-white p-3">
                <option value="">Ordenar por precio</option>
                <option value="asc">Menor a mayor</option>
                <option value="desc">Mayor a menor</option>
            </select>
        </div>

        <div id="productos" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
    </div>

    <script>
        const productos = [
            { nombre: "Laptop", precio: 12500, categoria: "Computación" },
            { nombre: "Mouse", precio: 350, categoria: "Accesorios" },
            { nombre: "Teclado", precio: 900, categoria: "Accesorios" },
            { nombre: "Monitor", precio: 3200, categoria: "Computación" }
        ];

        function mostrarProductos() {
            const texto = document.getElementById("buscar").value.toLowerCase();
            const categoriaSeleccionada = document.getElementById("filtroCategoria").value;
            const orden = document.getElementById("ordenPrecio").value;
            const contenedor = document.getElementById("productos");

            contenedor.replaceChildren();

            // 1. Filtrar por texto y categoría
            let resultado = productos.filter(p => {
                const coincideTexto = p.nombre.toLowerCase().includes(texto);
                const coincideCategoria = categoriaSeleccionada === "" || p.categoria === categoriaSeleccionada;
                return coincideTexto && coincideCategoria;
            });

            // 2. Ordenar por precio si se seleccionó una opción
            if (orden === "asc") {
                resultado.sort((a, b) => a.precio - b.precio);
            } else if (orden === "desc") {
                resultado.sort((a, b) => b.precio - a.precio);
            }

            // 3. Renderizar las tarjetas
            resultado.forEach(p => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "rounded-xl bg-white p-5 shadow flex flex-col justify-between";

                const infoContainer = document.createElement("div");
                const titulo = document.createElement("h3");
                titulo.className = "text-xl font-bold";
                titulo.textContent = p.nombre;

                const categoria = document.createElement("span");
                categoria.className = "inline-block my-1 text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded";
                categoria.textContent = p.categoria;

                const precio = document.createElement("p");
                precio.className = "mt-2 text-green-600 font-semibold";
                precio.textContent = "$" + p.precio.toLocaleString("es-MX");

                infoContainer.append(titulo, categoria, precio);
                tarjeta.append(infoContainer);
                contenedor.appendChild(tarjeta);
            });
        }

        // Eventos reactivos en tiempo real
        document.getElementById("buscar").addEventListener("input", mostrarProductos);
        document.getElementById("filtroCategoria").addEventListener("change", mostrarProductos);
        document.getElementById("ordenPrecio").addEventListener("change", mostrarProductos);

        // Carga inicial
        mostrarProductos();
    </script>

    <br><br>

    <div class="p-8 text-center">
        <button id="abrir" class="rounded bg-indigo-600 px-6 py-3 text-white">Abrir modal</button>
    </div>

    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
        <div role="dialog" aria-modal="true" aria-labelledby="tituloModal"
            class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
            <h2 id="tituloModal" class="text-2xl font-bold">Información importante</h2>
            <p class="my-4 text-gray-600">Ventana creada con Tailwind y JavaScript.</p>
            <button id="cerrar" class="rounded bg-red-600 px-5 py-2 text-white">Cerrar</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById("modal");
        const abrir = document.getElementById("abrir");
        const cerrar = document.getElementById("cerrar");

        abrir.addEventListener("click", () => {
            modal.classList.remove("hidden");
            modal.classList.add("flex");

            // Reto: Colocar el foco dentro del modal al abrir (en el botón de cerrar)
            cerrar.focus();
        });

        function cerrarModal() {
            modal.classList.add("hidden");
            modal.classList.remove("flex");

            // Reto: Devolver el foco al botón original que abrió el modal
            abrir.focus();
        }

        cerrar.addEventListener("click", cerrarModal);

        // Reto: Cerrar al pulsar fuera del cuadro (en el fondo oscuro)
        modal.addEventListener("click", e => {
            if (e.target === modal) {
                cerrarModal();
            }
        });

        // Cerrar con la tecla Escape
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && !modal.classList.contains("hidden")) {
                cerrarModal();
            }
        });
    </script>

</body>

</html>
